plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.smartnet.monitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.smartnet.monitor"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "2.9"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
}
